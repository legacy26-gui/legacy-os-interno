# Backup diário do banco, guardado FORA do Neon e FORA da Vercel.
#
# A janela de histórico do Neon protege de erro recente (6h no plano grátis,
# 1 dia no pago). Não protege de problema na conta nem de algo que só se
# descobre duas semanas depois. Por isso existe esta cópia independente.
#
# Precisa de dois segredos no repositório
# (Settings → Secrets and variables → Actions → New repository secret):
#   DATABASE_URL        a string de conexão do Neon (a mesma que está na Vercel)
#   BACKUP_PASSPHRASE   uma senha forte, guardada no seu gerenciador de senhas
#
# Sem a senha o arquivo não abre — nem por você. Guarde-a antes de precisar.

name: Backup do banco

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília, quando ninguém está mexendo no sistema.
    - cron: "0 6 * * *"
  # Permite rodar na mão pelo botão "Run workflow", pra testar ou pra tirar
  # uma cópia antes de uma mudança grande.
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Instalar o cliente mais novo do Postgres
        # O pg_dump precisa ser igual ou MAIS NOVO que o servidor, senão ele
        # se recusa a rodar — e o que vem na imagem do runner é mais antigo.
        #
        # Nada de versão fixa aqui. Esta linha já dizia "17" e quebrou o
        # backup no dia em que o Neon passou pra 18:
        #
        #   pg_dump: error: aborting because of server version mismatch
        #   detail: server version: 18.7; pg_dump version: 17.12
        #
        # Backup que para sozinho quando o provedor atualiza é backup que não
        # existe, porque ninguém olha workflow que vinha passando. Então
        # instala o metapacote (que aponta sempre pro mais novo) e descobre o
        # caminho em vez de escrevê-lo à mão. No dia em que o Neon for pro 19,
        # isto continua funcionando sem ninguém mexer.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # Com nova tentativa: esta chamada já derrubou um backup inteiro
          # com "SSL_read: unexpected eof" — um soluço de rede do runner, que
          # na segunda tentativa passa. Backup que quebra por isso é backup
          # em que não se pode confiar, e o pior é que a falha parece grave.
          sudo curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # O runner já vem com um cliente antigo e ele continua ganhando no
          # PATH. `sort -V` ordena por número de versão (assim 9 não vem
          # depois de 18), e o último é o mais novo instalado.
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
          "$PG_BIN/pg_dump" --version

      - name: Conferir a conexão
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta o segredo DATABASE_URL no repositório."
            exit 1
          fi
          echo "Servidor: $("$PG_BIN/psql" "$DATABASE_URL" -tAc 'select version()')"
          # EM QUAL banco, com qual usuário, e quantas tabelas tem lá dentro.
          #
          # Conectar não é o mesmo que conectar no lugar certo. Um projeto do
          # Neon costuma ter mais de um banco (o `neondb` que vem de fábrica,
          # além do que a aplicação usa), e a string que o painel oferece nem
          # sempre é a do banco certo. O dump sai sem erro nenhum, com 900
          # bytes e nenhuma tabela — e sem esta linha, descobrir isso é
          # adivinhação.
          echo "Banco/usuário: $("$PG_BIN/psql" "$DATABASE_URL" -tAc 'select current_database() || E'"'"' / '"'"' || current_user')"
          TABELAS=$("$PG_BIN/psql" "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "Tabelas no schema public: $TABELAS"
          if [ "$TABELAS" -lt 5 ]; then
            # Entrou no lugar errado. Em vez de só reclamar, mostra o que
            # EXISTE ali do lado — é o que transforma "está vazio" em "o
            # banco certo é esse aqui".
            echo "Bancos neste servidor:"
            "$PG_BIN/psql" "$DATABASE_URL" -tAc \
              "select datname from pg_database where datistemplate = false order by 1" \
              | sed 's/^/  - /'
            echo "Schemas com tabelas neste banco:"
            "$PG_BIN/psql" "$DATABASE_URL" -tAc \
              "select table_schema || ': ' || count(*) from information_schema.tables
               where table_schema not in ('pg_catalog', 'information_schema')
               group by table_schema order by 1" \
              | sed 's/^/  - /'
            echo "::error::Só $TABELAS tabela(s) no schema public deste banco. A DATABASE_URL aponta pro banco errado — veja a lista acima e troque o nome do banco no fim da string (ou a branch, se os dados estiverem em outra)."
            exit 1
          fi

      - name: Gerar o dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          ARQUIVO="legacyos-$(date -u +%Y-%m-%d).dump"
          echo "ARQUIVO=$ARQUIVO" >> "$GITHUB_ENV"
          # Formato custom (-Fc): já vem compactado e permite restaurar tabela
          # por tabela. Sem dono e sem permissões, pra restaurar em qualquer
          # banco novo sem depender dos papéis do Neon.
          "$PG_BIN/pg_dump" "$DATABASE_URL" --no-owner --no-privileges --format=custom --file="$ARQUIVO"
          ls -lh "$ARQUIVO"

      - name: Conferir que o dump não veio vazio
        run: |
          set -euo pipefail
          TAMANHO=$(stat -c%s "$ARQUIVO")
          echo "Tamanho: $TAMANHO bytes"
          # Backup que "deu certo" mas veio vazio é pior que backup que falhou,
          # porque ninguém percebe até precisar dele.
          if [ "$TAMANHO" -lt 10240 ]; then
            echo "::error::Dump com $TAMANHO bytes — pequeno demais pra ser um backup de verdade."
            exit 1
          fi
          # Lista o que entrou, como prova do que foi salvo.
          "$PG_BIN/pg_restore" --list "$ARQUIVO" | grep -c "TABLE DATA" | xargs echo "Tabelas com dados:"

      - name: Criptografar
        env:
          SENHA: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SENHA" ]; then
            echo "::error::Falta o segredo BACKUP_PASSPHRASE no repositório."
            exit 1
          fi
          # O arquivo tem dado de cliente: não pode ficar guardado em claro.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$SENHA" --output "$ARQUIVO.gpg" "$ARQUIVO"
          rm -f "$ARQUIVO"
          ls -lh "$ARQUIVO.gpg"

      - name: Guardar
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: ${{ env.ARQUIVO }}.gpg
          retention-days: 30
          if-no-files-found: error
